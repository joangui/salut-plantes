name: Construeix, prova i publica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependències de Node (versions fixades)
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependències de Python
        run: pip install numpy playwright onnxruntime pillow scikit-learn

      - name: Memòria cau dels models
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: models-${{ hashFiles('tools/fetch_models.py') }}

      - name: Descarrega i prepara els models
        run: python tools/fetch_models.py --out models --cache .model-cache

      - name: Llista d'espècies de la guia
        run: node tools/kb_species.mjs > .kb-species.json

      - name: Memòria cau de les espècies afegides
        id: taxa-cache
        uses: actions/cache@v4
        with:
          path: .taxa-cache
          key: taxa-${{ hashFiles('.kb-species.json', 'tools/extend_taxa.py') }}

      - name: Codificador de text de BioCLIP 2.5 (només si cal)
        if: steps.taxa-cache.outputs.cache-hit != 'true'
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch huggingface_hub safetensors

      - name: Afegeix a la taula les plantes de la guia que hi falten
        run: python tools/extend_taxa.py --models models --species .kb-species.json --cache .taxa-cache

      - name: Memòria cau del detector de símptomes
        uses: actions/cache@v4
        with:
          path: .symptom-cache
          key: symptoms-v2-${{ hashFiles('tools/symptom_sources.json') }}
          restore-keys: symptoms-v2-

      - name: Entrena el detector de símptomes (fotos obertes)
        run: python tools/symptom_train.py --models models --cache .symptom-cache

      - name: Copia les biblioteques a vendor/
        run: node tools/vendor.mjs .

      - name: Tests de la lògica i la guia
        run: node tools/test_logic.mjs

      - name: Identificació amb fotos reals
        run: node tools/ci_light.mjs

      - name: Símptomes amb fotos reals
        run: node tools/ci_symptoms.mjs

      - name: Munta el lloc
        run: python tools/assemble.py _site

      - name: Prova al navegador, també sense connexió
        run: |
          python -m playwright install --with-deps chromium
          python tools/ci_browser.py _site

      - name: Desa els resultats de les proves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-proves
          path: ci-artifacts
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Comprova el lloc publicat
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 30
          for f in "" sw.js app.js ranking.js models/manifest.json vendor/ort/ort.wasm.min.mjs; do
            printf '%s  %s\n' "$(curl -s -o /dev/null -w '%{http_code}' "$URL$f")" "/$f"
          done
          curl -s "${URL}sw.js" | grep -m1 'const VERSION'
          curl -s "$URL" | grep -o '<title>[^<]*</title>'
